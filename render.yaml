databases:
  - name: qinmian-db
    plan: free
    databaseName: qinmian
    user: qinmian

services:
  - type: web
    name: qinmian-ai-v4
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: QINMIAN_LLM_PROVIDER
        value: openai
      - key: QINMIAN_LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: QINMIAN_LLM_MODEL
        value: gpt-5.6-terra
      - key: QINMIAN_VISION_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_API_KEY
        sync: false
      - key: QINMIAN_SECRET_KEY
        generateValue: true
      - key: QINMIAN_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: qinmian-db
          property: connectionString
